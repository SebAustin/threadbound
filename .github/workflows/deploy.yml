name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs, Markdown and the .scratch/ planning notes never change the game, so they don't redeploy it.
    paths-ignore: ['docs/**', '**/*.md', '.scratch/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      # The production smoke runs here, in the build job, so dist/ needs no hand-off
      # and a failing smoke never reaches the Pages upload.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke
          path: .tmp/prod-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
